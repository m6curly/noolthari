<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#0B3D45"
  >

  <meta
    name="description"
    content="NOOLTHARI™ Admin Dashboard."
  >

  <title>
    Admin Dashboard | NOOLTHARI™
  </title>


  <!-- =====================================================
       FONTS
  ====================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- =====================================================
       STYLES
  ====================================================== -->

  <link
    rel="stylesheet"
    href="../css/main.css"
  >

  <link
    rel="stylesheet"
    href="../css/admin.css"
  >

</head>


<body data-root="../">


  <!-- =====================================================
       ADMIN LAYOUT
  ====================================================== -->

  <div class="admin-shell">


    <!-- ===================================================
         SIDEBAR
    ==================================================== -->

    <aside class="admin-side">

      <div class="admin-top">


        <a
          class="admin-logo"
          href="index.html"
          aria-label="NOOLTHARI Admin Dashboard"
        >

          <img
            src="../assets/logo/noolthari-logo.png"
            alt="NOOLTHARI™"
            loading="eager"
          >


          <span>
            NOOLTHARI™
          </span>

        </a>


        <button
          class="admin-mobile-toggle"
          data-admin-menu
          type="button"
          aria-label="Open admin menu"
          aria-expanded="false"
        >
          Menu
        </button>

      </div>


      <!-- =================================================
           ADMIN NAVIGATION
      ================================================== -->

      <nav
        class="admin-nav"
        aria-label="Admin navigation"
      >

        <a
          href="index.html"
          class="active"
          aria-current="page"
        >
          Dashboard
        </a>

        <a href="products.html">
          Products
        </a>

        <a href="categories.html">
          Categories
        </a>

        <a href="orders.html">
          Orders
        </a>

        <a href="customers.html">
          Customers
        </a>

        <a href="returns.html">
          Returns
        </a>

        <a href="messages.html">
          Messages
        </a>

        <a href="accounting.html">
          Finance
        </a>


        <a href="../index.html">
          View store
        </a>

        <a href="../account.html">
          Account
        </a>

        <a
          href="#"
          data-logout
        >
          Sign out
        </a>

      </nav>

    </aside>


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="admin-main">


      <!-- ===================================================
           PAGE HEADER
      ==================================================== -->

      <header class="admin-page-header">

        <div class="eyebrow">
          NOOLTHARI™ ADMIN
        </div>


        <h1 class="page-title">
          Business dashboard
        </h1>

      </header>


      <!-- ===================================================
           DASHBOARD STATISTICS
      ==================================================== -->

      <section
        class="stat-grid"
        aria-label="Business dashboard statistics"
      >


        <!-- PRODUCTS -->

        <div class="stat">

          <div class="eyebrow">
            Products
          </div>

          <strong id="s-products">
            —
          </strong>

        </div>


        <!-- ORDERS -->

        <div class="stat">

          <div class="eyebrow">
            Orders
          </div>

          <strong id="s-orders">
            —
          </strong>

        </div>


        <!-- CUSTOMERS -->

        <div class="stat">

          <div class="eyebrow">
            Customers
          </div>

          <strong id="s-customers">
            —
          </strong>

        </div>


        <!-- RETURNS -->

        <div class="stat">

          <div class="eyebrow">
            Open returns
          </div>

          <strong id="s-returns">
            —
          </strong>

        </div>


        <!-- SALES -->

        <div class="stat">

          <div class="eyebrow">
            YTD sales
          </div>

          <strong id="s-sales">
            —
          </strong>

        </div>


        <!-- PROFIT -->

        <div class="stat">

          <div class="eyebrow">
            YTD profit
          </div>

          <strong id="s-profit">
            —
          </strong>

        </div>


        <!-- CASH -->

        <div class="stat">

          <div class="eyebrow">
            Cash / bank snapshot
          </div>

          <strong id="cash-balance">
            —
          </strong>

        </div>


        <!-- INVENTORY -->

        <div class="stat">

          <div class="eyebrow">
            Inventory value
          </div>

          <strong id="inventory-value">
            —
          </strong>

        </div>


        <!-- LOW STOCK -->

        <div class="stat">

          <div class="eyebrow">
            Low stock
          </div>

          <strong id="low-stock">
            —
          </strong>

        </div>


        <!-- EQUITY -->

        <div class="stat">

          <div class="eyebrow">
            Net equity snapshot
          </div>

          <strong id="equity-value">
            —
          </strong>

        </div>


      </section>


    </main>

  </div>


  <!-- =====================================================
       JAVASCRIPT
       Existing paths preserved
  ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"
  ></script>

  <script src="../js/config.js"></script>

  <script src="../js/supabase.js"></script>

  <script src="../js/utils.js"></script>

  <script src="../js/app.js"></script>

  <script src="../admin/js/dashboard.js"></script>


</body>

</html>
