<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#0B3D45"
  >

  <meta
    name="description"
    content="Edit NOOLTHARI™ product."
  >

  <title>
    Edit Product | NOOLTHARI™
  </title>


  <!-- =====================================================
       FONTS
  ====================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- =====================================================
       STYLES
  ====================================================== -->

  <link
    rel="stylesheet"
    href="../css/main.css"
  >

  <link
    rel="stylesheet"
    href="../css/admin.css"
  >

</head>


<body data-root="../">


  <!-- =====================================================
       ADMIN LAYOUT
  ====================================================== -->

  <div class="admin-shell">


    <!-- ===================================================
         SIDEBAR
    ==================================================== -->

    <aside class="admin-side">

      <div class="admin-top">


        <a
          class="admin-logo"
          href="index.html"
          aria-label="NOOLTHARI Admin Dashboard"
        >

          <img
            src="../assets/logo/noolthari-logo.png"
            alt="NOOLTHARI™"
            loading="eager"
          >

          <span>
            NOOLTHARI™
          </span>

        </a>


        <button
          class="admin-mobile-toggle"
          data-admin-menu
          type="button"
          aria-label="Open admin menu"
          aria-expanded="false"
        >
          Menu
        </button>

      </div>


      <!-- =================================================
           ADMIN NAVIGATION
      ================================================== -->

      <nav
        class="admin-nav"
        aria-label="Admin navigation"
      >

        <a href="index.html">
          Dashboard
        </a>

        <a
          href="products.html"
          class="active"
          aria-current="page"
        >
          Products
        </a>

        <a href="categories.html">
          Categories
        </a>

        <a href="orders.html">
          Orders
        </a>

        <a href="customers.html">
          Customers
        </a>

        <a href="returns.html">
          Returns
        </a>

        <a href="messages.html">
          Messages
        </a>

        <a href="accounting.html">
          Finance
        </a>


        <a href="../index.html">
          View store
        </a>

        <a href="../account.html">
          Account
        </a>

        <a
          href="#"
          data-logout
        >
          Sign out
        </a>

      </nav>

    </aside>


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="admin-main">


      <header class="admin-page-header">

        <div class="eyebrow">
          Catalog
        </div>


        <h1 class="page-title">
          Edit saree
        </h1>


        <p class="finance-note">
          Update product information, pricing, stock and
          product images.
        </p>

      </header>


      <!-- ===================================================
           PRODUCT EDIT FORM
      ==================================================== -->

      <section
        class="admin-card"
        aria-label="Edit saree product"
      >

        <form
          id="product-form"
          class="admin-form"
        >


          <!-- =================================================
               BASIC PRODUCT INFORMATION
          ================================================== -->


          <div class="field">

            <label for="saree-name">
              Saree name
            </label>

            <input
              id="saree-name"
              name="saree_name"
              type="text"
              required
            >

          </div>


          <div class="field">

            <label for="sku">
              SKU
            </label>

            <input
              id="sku"
              name="sku"
              type="text"
              required
              spellcheck="false"
            >

          </div>


          <div class="field">

            <label for="category">
              Category
            </label>

            <select
              id="category"
              name="category_id"
              required
            ></select>

          </div>


          <div class="field">

            <label for="fabric">
              Fabric
            </label>

            <input
              id="fabric"
              name="fabric"
              type="text"
            >

          </div>


          <div class="field">

            <label for="colour">
              Colour
            </label>

            <input
              id="colour"
              name="colour"
              type="text"
            >

          </div>


          <div class="field">

            <label for="pattern">
              Pattern
            </label>

            <input
              id="pattern"
              name="pattern"
              type="text"
            >

          </div>


          <div class="field">

            <label for="occasion">
              Occasion
            </label>

            <input
              id="occasion"
              name="occasion"
              type="text"
            >

          </div>


          <!-- =================================================
               PRICING
          ================================================== -->


          <div class="field">

            <label for="purchase-price">
              Purchase price
            </label>

            <input
              id="purchase-price"
              name="purchase_price"
              type="number"
              min="0"
              step="0.01"
              inputmode="decimal"
              required
            >

          </div>


          <div class="field">

            <label for="selling-price">
              Selling price
            </label>

            <input
              id="selling-price"
              name="selling_price"
              type="number"
              min="0"
              step="0.01"
              inputmode="decimal"
              required
            >

          </div>


          <div class="field">

            <label for="sale-price">
              Sale price
              <span style="font-weight:400;color:#888;">
                (optional)
              </span>
            </label>

            <input
              id="sale-price"
              name="sale_price"
              type="number"
              min="0"
              step="0.01"
              inputmode="decimal"
            >

          </div>


          <div class="field">

            <label for="stock-quantity">
              Stock
            </label>

            <input
              id="stock-quantity"
              name="stock_quantity"
              type="number"
              min="0"
              step="1"
              inputmode="numeric"
              required
            >

          </div>


          <!-- =================================================
               DESCRIPTION
          ================================================== -->

          <div class="field full">

            <label for="description">
              Description
            </label>

            <textarea
              id="description"
              name="description"
              rows="6"
            ></textarea>

          </div>


          <!-- =================================================
               PRODUCT OPTIONS
          ================================================== -->


          <div class="field">

            <label>
              <input
                name="blouse_included"
                type="checkbox"
              >

              Blouse included

            </label>

          </div>


          <div class="field">

            <label>
              <input
                name="featured"
                type="checkbox"
              >

              Featured

            </label>

          </div>


          <div class="field">

            <label>
              <input
                name="active_toggle"
                type="checkbox"
              >

              Product active

            </label>

          </div>


          <div class="field">

            <label>
              <input
                name="bestseller"
                type="checkbox"
              >

              Bestseller

            </label>

          </div>


          <!-- =================================================
               PRODUCT IMAGES
          ================================================== -->

          <div class="field full">

            <label for="images">
              Product images
            </label>

            <input
              id="images"
              name="images"
              type="file"
              accept="image/*"
              multiple
            >

            <small>
              New images are permanently watermarked with
              NOOLTHARI before being uploaded to Supabase Storage.
            </small>

          </div>


          <!-- =================================================
               SUBMIT
          ================================================== -->

          <div class="full">

            <button
              class="btn btn-gold"
              type="submit"
            >
              Save product
            </button>

          </div>


        </form>

      </section>

    </main>

  </div>


  <!-- =====================================================
       JAVASCRIPT
       Existing paths preserved
  ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"
  ></script>

  <script src="../js/config.js"></script>

  <script src="../js/supabase.js"></script>

  <script src="../js/utils.js"></script>

  <script src="../js/app.js"></script>

  <script src="../admin/js/products.js"></script>


</body>

</html>
