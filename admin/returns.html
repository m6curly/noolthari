<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#0B3D45"
  >

  <meta
    name="description"
    content="Manage NOOLTHARI™ customer return requests."
  >

  <title>
    Returns | NOOLTHARI™
  </title>


  <!-- =====================================================
       FONTS
  ====================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- =====================================================
       STYLES
  ====================================================== -->

  <link
    rel="stylesheet"
    href="../css/main.css"
  >

  <link
    rel="stylesheet"
    href="../css/admin.css"
  >


  <!-- =====================================================
       PAGE-LOCAL EVIDENCE STYLES
  ====================================================== -->

  <style>

    .return-evidence{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .return-evidence a{
      display:inline-flex;
      align-items:center;
      justify-content:center;

      min-height:38px;

      padding:
        8px
        13px;

      border:
        1px solid
        var(--teal);

      border-radius:5px;

      background:#fff;

      color:var(--teal);

      font:
        600 11px/1
        Poppins,
        sans-serif;

      letter-spacing:.045em;

      text-transform:uppercase;

      transition:
        color .2s ease,
        background .2s ease,
        border-color .2s ease,
        transform .2s ease;
    }

    .return-evidence a:hover{
      color:#fff;

      background:var(--teal);

      border-color:var(--teal);

      transform:translateY(-1px);
    }

    .return-evidence-empty{
      color:#9A9388;

      font:
        500 11px/1.4
        Poppins,
        sans-serif;
    }

    .return-evidence-preview{
      width:56px;
      height:70px;

      display:block;

      object-fit:cover;

      border:
        1px solid
        var(--line);

      border-radius:4px;

      background:var(--bg2);

      box-shadow:
        0 5px 14px rgba(11,61,69,.06);
    }

    .return-evidence-cell{
      min-width:170px;
    }

    .return-description{
      min-width:220px;

      max-width:360px;

      white-space:normal;

      line-height:1.55;
    }

  </style>

</head>


<body data-root="../">


  <!-- =====================================================
       ADMIN LAYOUT
  ====================================================== -->

  <div class="admin-shell">


    <!-- ===================================================
         SIDEBAR
    ==================================================== -->

    <aside class="admin-side">

      <div class="admin-top">


        <a
          class="admin-logo"
          href="index.html"
          aria-label="NOOLTHARI Admin Dashboard"
        >

          <img
            src="../assets/logo/noolthari-logo.png"
            alt="NOOLTHARI™"
            loading="eager"
          >

          <span>
            NOOLTHARI™
          </span>

        </a>


        <button
          class="admin-mobile-toggle"
          data-admin-menu
          type="button"
          aria-label="Open admin menu"
          aria-expanded="false"
        >
          Menu
        </button>

      </div>


      <!-- =================================================
           ADMIN NAVIGATION
      ================================================== -->

      <nav
        class="admin-nav"
        aria-label="Admin navigation"
      >

        <a href="index.html">
          Dashboard
        </a>

        <a href="products.html">
          Products
        </a>

        <a href="categories.html">
          Categories
        </a>

        <a href="orders.html">
          Orders
        </a>

        <a href="customers.html">
          Customers
        </a>

        <a
          href="returns.html"
          class="active"
          aria-current="page"
        >
          Returns
        </a>

        <a href="messages.html">
          Messages
        </a>

        <a href="accounting.html">
          Finance
        </a>


        <a href="../index.html">
          View store
        </a>

        <a href="../account.html">
          Account
        </a>

        <a
          href="#"
          data-logout
        >
          Sign out
        </a>

      </nav>

    </aside>


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="admin-main">


      <header class="admin-page-header">

        <div class="eyebrow">
          Returns
        </div>


        <h1 class="page-title">
          Damage / defect returns
        </h1>


        <p class="finance-note">
          Review customer return requests, inspect submitted evidence
          and update return status.
        </p>

      </header>


      <!-- ===================================================
           RETURNS TABLE
      ==================================================== -->

      <section
        class="admin-card"
        aria-label="Customer returns"
      >

        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th scope="col">
                  Order
                </th>

                <th scope="col">
                  Customer
                </th>

                <th scope="col">
                  Reason
                </th>

                <th scope="col">
                  Status
                </th>

                <th scope="col">
                  Description
                </th>

                <th scope="col">
                  Evidence
                </th>

              </tr>

            </thead>


            <!-- ID preserved for returns.js -->

            <tbody
              id="returns-table"
            ></tbody>

          </table>

        </div>

      </section>


    </main>

  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"
  ></script>

  <script src="../js/config.js"></script>

  <script src="../js/supabase.js"></script>

  <script src="../js/utils.js"></script>

  <script src="../js/app.js"></script>

  <script src="../admin/js/returns.js"></script>


</body>

</html>
