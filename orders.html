<!doctype html>
<html lang="en">

  >

  <meta
    name="description"
    content="View your NOOLTHARI™ orders and order history."
  >

  <meta
    name="theme-color"

  <!-- =====================================================
       FONTS
  ====================================================== -->
<!-- =====================================================
       STYLES
  ====================================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link

    href="css/main.css"

  <link
    rel="stylesheet"
    href="css/responsive.css"

  >

  <link rel="stylesheet" href="css/v2.css">
  <link rel="stylesheet" href="css/unified.css">

<body data-root="./">


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="site-header">

    <div class="container nav-wrap">

      <nav
        class="nav"
        data-site-nav
        aria-label="Main navigation"

        <a href="index.html">

        <a href="about.html">
          About

        <a href="contact.html">
          Contact
        </a>

      </nav>

        <a class="icon-link header-tool" href="account.html" aria-label="My account" title="My account"><svg class="ui-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path></svg></a>

    </div>

       MAIN
  ====================================================== -->

  <main>

    <section class="page">

      <div class="container">


        <div class="eyebrow">
          My account
        </div>


        <h1 class="page-title">
          My orders
        </h1>


        <!--
          Orders are rendered by js/orders.js.
        -->

        <section
          id="orders-list"
          aria-label="Order history"
          aria-live="polite"
        ></section>


      </div>

    </section>

  </main>

       FOOTER
  ====================================================== -->

  <footer class="site-footer">

    <div class="container footer-grid">


      <!-- BRAND -->

      <div>

        <div class="eyebrow">
          NOOLTHARI™
        </div>

        <h3>
          Timeless sarees,<br>
          quietly luxurious.
        </h3>

        <p>
          Premium Indian sarees curated with restraint,
          craft and modern elegance.
        </p>

      </div>


      <!-- SHOP -->

      <div>

        <div class="eyebrow">
          Shop
        </div>

        <a href="shop.html">
          All Sarees
        </a>

        <a href="cart.html">
          Bag
        </a>

      </div>


      <!-- HELP -->

        </div>

        <a href="shipping-policy.html">
          Shipping

          Returns

      ©

      NOOLTHARI™. All rights reserved.

    </div>

  ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"
  ></script>

  <script src="js/config.js"></script>

  <script src="js/supabase.js"></script>

  <script src="js/utils.js"></script>

  <script src="js/app.js"></script>

  <script src="js/orders.js"></script>
