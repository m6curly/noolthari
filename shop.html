<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="description"
    content="Explore the NOOLTHARI™ collection of premium Indian sarees."
  >

  <meta
    name="theme-color"
    content="#0B3D45"
  >

  <title>
    Shop | NOOLTHARI™
  </title>


  <!-- =====================================================
       FONTS
  ====================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- =====================================================
       STYLES
  ====================================================== -->

  <link
    rel="stylesheet"
    href="css/main.css"
  >

  <link
    rel="stylesheet"
    href="css/responsive.css"
  >


  <!-- =====================================================
       STICKY SHOP FILTERS
  ====================================================== -->

  <style>

    #filters{
      position:sticky;
      top:94px;
      z-index:90;

      padding-top:14px;
      padding-bottom:14px;

      background:rgba(252,250,247,.96);

      border-bottom:
        1px solid
        rgba(200,148,51,.10);

      backdrop-filter:blur(14px) saturate(120%);
      -webkit-backdrop-filter:blur(14px) saturate(120%);
    }


    @media (max-width:700px){

      #filters{
        top:0;

        padding-top:10px;
        padding-bottom:10px;

        margin-inline:-20px;
        padding-inline:20px;
      }

    }

  </style>

</head>


<body data-root="./">


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="site-header">

    <div class="container nav-wrap">


      <!-- BRAND -->

      <a
        class="brand"
        href="index.html"
        aria-label="NOOLTHARI™ Home"
      >

        <img
          src="assets/logo/noolthari-logo.png"
          alt="NOOLTHARI™ logo"
          loading="eager"
        >

        <span>
          NOOLTHARI<small>™</small>
        </span>

      </a>


      <!-- MAIN NAVIGATION -->

      <nav
        class="nav"
        data-site-nav
        aria-label="Main navigation"
      >

        <a href="index.html">
          Home
        </a>

        <a
          href="shop.html"
          aria-current="page"
        >
          Shop
        </a>

        <a href="about.html">
          About
        </a>

        <a href="contact.html">
          Contact
        </a>

      </nav>


      <!-- HEADER ACTIONS -->

      <div class="nav-right">


        <a
          class="icon-link"
          href="shop.html"
          aria-label="Search"
          title="Search"
        >
          ⌕
        </a>


        <a
          class="icon-link"
          href="cart.html"
          aria-label="Cart"
          title="Cart"
        >
          👜
        </a>


        <div
          class="auth-slot"
          data-auth-slot
        ></div>


        <button
          class="menu"
          data-menu-toggle
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
        >
          ☰
        </button>


      </div>

    </div>

  </header>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main>

    <section class="page">

      <div class="container">


        <!-- PAGE HEADER -->

        <div class="eyebrow">
          NOOLTHARI™
        </div>


        <h1 class="page-title">
          The collection
        </h1>


        <!-- =================================================
             FILTERS
        ================================================== -->

        <form
          id="filters"
          class="toolbar"
        >


          <!-- SEARCH -->

          <input
            id="search"
            type="search"
            name="search"
            placeholder="Search sarees…"
            autocomplete="off"
            aria-label="Search sarees"
          >


          <!-- CATEGORY -->

          <select
            id="category"
            name="category"
            aria-label="Filter by category"
          >

            <option value="">
              All categories
            </option>

          </select>


          <!-- SORT -->

          <select
            id="sort"
            name="sort"
            aria-label="Sort products"
          >

            <option value="newest">
              Newest
            </option>

            <option value="low">
              Price: low to high
            </option>

            <option value="high">
              Price: high to low
            </option>

          </select>


        </form>


        <!-- =================================================
             PRODUCT GRID
        ================================================== -->

        <section
          id="product-grid"
          class="grid"
          aria-label="NOOLTHARI sarees"
          aria-live="polite"
        ></section>


      </div>

    </section>

  </main>


  <!-- =====================================================
       FOOTER
  ====================================================== -->

  <footer class="site-footer">

    <div class="container footer-grid">


      <!-- BRAND -->

      <div>

        <div class="eyebrow">
          NOOLTHARI™
        </div>

        <h3>
          Timeless sarees,<br>
          quietly luxurious.
        </h3>

        <p>
          Premium Indian sarees curated with restraint,
          craft and modern elegance.
        </p>

      </div>


      <!-- SHOP -->

      <div>

        <div class="eyebrow">
          Shop
        </div>

        <a
          href="shop.html"
          aria-current="page"
        >
          All Sarees
        </a>

        <a href="cart.html">
          Bag
        </a>

      </div>


      <!-- HELP -->

      <div>

        <div class="eyebrow">
          Help
        </div>

        <a href="shipping-policy.html">
          Shipping
        </a>

        <a href="return-policy.html">
          Returns
        </a>

        <a href="contact.html">
          Contact
        </a>

      </div>


      <!-- LEGAL -->

      <div>

        <div class="eyebrow">
          Legal
        </div>

        <a href="privacy-policy.html">
          Privacy
        </a>

        <a href="terms.html">
          Terms
        </a>

      </div>


    </div>


    <div class="container footer-bottom">

      ©
      <span data-year></span>
      NOOLTHARI™.
      All rights reserved.

    </div>

  </footer>


  <!-- =====================================================
       SCRIPTS
       Order is important
  ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"
  ></script>

  <script src="js/config.js"></script>

  <script src="js/supabase.js"></script>

  <script src="js/utils.js"></script>

  <script src="js/app.js"></script>

  <!-- Product card + cart + stock + Buy Now logic -->
  <script src="js/catalog.js"></script>

  <!-- Shop filter / search / sort logic -->
  <script src="js/shop.js"></script>


</body>

</html>
